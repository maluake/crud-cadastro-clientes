{% extends 'base.html' %}

{% block title %}Entrar · Cadastro de Clientes{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">

        <h1 class="h3 mb-3">Entrar</h1>
        <p class="text-muted">O cadastro guarda dados pessoais de clientes, por isso o acesso exige login.</p>

        {% if form.errors %}
        <div class="alert alert-danger" role="alert">
            Usuário ou senha incorretos.
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">Usuário</label>
                <input type="text" name="username" id="id_username" class="form-control"
                       autocomplete="username" autofocus required
                       value="{{ form.username.value|default:'' }}">
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Senha</label>
                <input type="password" name="password" id="id_password" class="form-control"
                       autocomplete="current-password" required>
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

    </div>
</div>

{% endblock %}
