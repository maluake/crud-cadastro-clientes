<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cadastro de Clientes{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'listar' %}">
            Cadastro de Clientes
        </a>

        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">
            <span class="navbar-text">Olá, {{ user.get_username }}</span>
            <form method="POST" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>

<main class="container mt-4">

    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}" role="status">
        {{ message }}
    </div>
    {% endfor %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
