{% extends 'base.html' %}

{% block title %}Excluir cliente{% endblock %}

{% block content %}

<h1 class="h2 mb-4">Excluir Cliente</h1>

<p>Deseja realmente excluir <strong>{{ cliente.nome }}</strong>? Esta ação não pode ser desfeita.</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Excluir
    </button>

    <a href="{% url 'listar' %}" class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
