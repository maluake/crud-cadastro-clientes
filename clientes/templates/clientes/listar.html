{% extends 'base.html' %}

{% block content %}

<h2>Clientes</h2>

<form method="GET" class="mb-3">

    <input
        type="text"
        name="busca"
        class="form-control"
        placeholder="Buscar cliente">

</form>

<a href="{% url 'novo' %}"
   class="btn btn-primary mb-3">

    Novo Cliente

</a>

<table class="table table-striped">

    <thead>
        <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>

    {% for cliente in clientes %}

        <tr>

            <td>{{ cliente.nome }}</td>
            <td>{{ cliente.cpf }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.telefone }}</td>

            <td>

                <a href="{% url 'editar' cliente.id %}"
                   class="btn btn-warning btn-sm">

                   Editar

                </a>

                <a href="{% url 'excluir' cliente.id %}"
                   class="btn btn-danger btn-sm">

                   Excluir

                </a>

            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
